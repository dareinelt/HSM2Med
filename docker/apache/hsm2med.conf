<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -FollowSymLinks -ExecCGI
        AllowOverride None
        Require all granted

        # Alle nicht existierenden Pfade an den Front-Controller
        FallbackResource /index.php

        # Ausschliesslich der Front-Controller darf als PHP ausgefuehrt werden
        <FilesMatch "\.(php|phtml|phar|pht|php\d)$">
            Require all denied
        </FilesMatch>
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>

    # Kein Zugriff ausserhalb von public/
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
    </Directory>

    # Datenschutz: Zugriffslog ohne Query-String (Suchbegriffe koennen Patientendaten enthalten)
    LogFormat "%h %t \"%m %U %H\" %>s %b %D" hsm2med_privacy
    CustomLog /proc/self/fd/1 hsm2med_privacy
    ErrorLog /proc/self/fd/2
</VirtualHost>
