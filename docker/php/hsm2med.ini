; HSM2Med PHP-Konfiguration (ergaenzt php.ini-production)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Uploads: die konkreten Groessen werden beim Containerstart aus UPLOAD_MAX_SIZE
; erzeugt (siehe docker/entrypoint.sh -> zz-hsm2med-limits.ini).
file_uploads = On
max_file_uploads = 1

; Keine Netzwerkzugriffe ueber Datei-Wrapper
allow_url_fopen = Off
allow_url_include = Off

memory_limit = 256M
max_execution_time = 120

; Sessions (zusaetzlich zur Laufzeitkonfiguration in App\Security\SessionManager)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Strict

opcache.enable = 1
opcache.validate_timestamps = 0
